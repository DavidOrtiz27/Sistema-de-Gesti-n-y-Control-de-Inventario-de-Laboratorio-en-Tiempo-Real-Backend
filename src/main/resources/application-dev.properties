# Cargar los secretos locales desde el .env
spring.config.import=optional:file:.env[.properties]
# Spring levanta el contenedor de Postgres solo
spring.docker.compose.enabled=true
# Al detener la app, el contenedor sigue corriendo (arranques mas rapido)
spring.docker.compose.lifecycle-management=start-only
# Ver el SQL que genera Hibernate
logging.level.org.hibernate.SQL=debug
