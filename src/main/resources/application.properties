spring.application.name=backend
# Version de la api
server.servlet.context-path=/api/v1

server.port=8082

# Perfil por defecto. En producción se sobrescribe con la variable SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# Base de datos: solo referencias, sin valores reales
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health checks para Kubernetes (/actuator/health/liveness y /readiness)
management.endpoint.health.probes.enabled=true
